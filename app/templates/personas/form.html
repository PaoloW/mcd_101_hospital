{% extends "base.html" %}

{% block title %}{{ 'Editar' if persona else 'Nueva' }} persona — Hospital{% endblock %}

{% block content %}
<div class="d-flex justify-content-center">
    <div class="card col-12 col-md-9">
        <div class="card-header">
                <h2 style="margin-bottom: 1.5rem;">{{ 'Editar' if persona else 'Nueva' }} persona</h2>
        </div>
        <div class="card-body">
            <form
                method="POST"
                id="form-persona"
                action="{{ url_for('personas.actualizar_persona', persona_id=persona.id) if persona else url_for('personas.guardar_persona') }}"
            >
                <div class="row">
                    <div class="col-12 col-md-6 mb-3">
                        <label class="form-label" for="numero_documento">Número de documento</label>
                        <input
                            type="text"
                            id="numero_documento"
                            name="numero_documento"
                            class="form-control"
                            value="{{ persona.numero_documento if persona else '' }}"
                            maxlength="15"
                            required>
                    </div>
                    <div class="col-12 col-md-6 mb-3">
                        <label class="form-label" for="nombres">Nombres</label>
                        <input
                            type="text"
                            id="nombres"
                            name="nombres"
                            class="form-control"
                            value="{{ persona.nombres if persona else '' }}">
                    </div>
                    <div class="col-12 col-md-6 mb-3">
                        <label class="form-label" for="primer_apellido">Primer apellido</label>
                        <input
                            type="text"
                            id="primer_apellido"
                            name="primer_apellido"
                            class="form-control"
                            value="{{ persona.primer_apellido if persona else '' }}">
                    </div>
                    <div class="col-12 col-md-6 mb-3">
                        <label class="form-label" for="segundo_apellido">Segundo apellido</label>
                        <input
                            type="text"
                            id="segundo_apellido"
                            name="segundo_apellido"
                            class="form-control"
                            value="{{ persona.segundo_apellido if persona else '' }}">
                    </div>
                    <div class="col-12 col-md-6 mb-3">
                        <label class="form-label" for="fecha_nacimiento">Fecha de nacimiento</label>
                        <input
                            type="date"
                            id="fecha_nacimiento"
                            name="fecha_nacimiento"
                            class="form-control"
                            value="{{ persona.fecha_nacimiento if persona and persona.fecha_nacimiento else '' }}">
                    </div>
                    <div class="col-12 col-md-6 mb-3">
                        <label class="form-label" for="sexo">Sexo</label>
                        <select id="sexo" name="sexo" class="form-select">
                            <option value="">— Seleccionar —</option>
                            <option value="M" {{ 'selected' if persona and persona.sexo == 'M' else '' }}>Masculino</option>
                            <option value="F" {{ 'selected' if persona and persona.sexo == 'F' else '' }}>Femenino</option>
                        </select>
                    </div>
                    <div class="col-12 mb-3">
                        <label class="form-label" for="direccion">Dirección</label>
                        <input
                            type="text"
                            id="direccion"
                            name="direccion"
                            class="form-control"
                            value="{{ persona.direccion if persona else '' }}">
                    </div>
                    <div class="col-12 mb-3">
                        <label class="form-label" for="telefono">Teléfono</label>
                        <input
                            type="text"
                            id="telefono"
                            name="telefono"
                            class="form-control"
                            value="{{ persona.telefono if persona else '' }}">
                    </div>
                    <div class="col-12 mb-3">
                        <label class="form-label" for="correo">Correo electrónico</label>
                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            class="form-control"
                            value="{{ persona.correo if persona else '' }}">
                    </div>
                    <div class="col-12 text-end">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                        <a href="{{ url_for('personas.listar_personas') }}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
