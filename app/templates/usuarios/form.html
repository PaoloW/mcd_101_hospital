{% extends "base.html" %}

{% block title %}{{ 'Editar' if usuario else 'Nuevo' }} usuario — Hospital{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px;">
    <h2 style="margin-bottom: 1.5rem;">{{ 'Editar' if usuario else 'Nuevo' }} usuario</h2>

    <form method="POST"
          action="{{ url_for('usuarios.editar_usuario', usuario_id=usuario.id) if usuario else url_for('usuarios.crear_usuario') }}">
        <label for="usuario">Usuario</label>
        <input type="text" id="username" name="username"
               value="{{ usuario.username if usuario else '' }}" required>

        <label for="password">Contraseña{% if usuario %} (dejar vacío para no cambiar){% endif %}</label>
        <input type="password" id="password" name="password" {{ '' if usuario else 'required' }}>

        <label for="rol_id">Rol</label>
        <select id="rol_id" name="rol_id">
            <option value="1" {{ 'selected' if usuario and usuario.rol_id == 1 else '' }}>Admin</option>
            <option value="2" {{ 'selected' if not usuario or usuario.rol_id != 1 else '' }}>Usuario</option>
        </select>

        <label for="estado">Estado</label>
        <select id="estado" name="estado">
            <option value="1" {{ 'selected' if not usuario or usuario.estado == 1 else '' }}>Activo</option>
            <option value="0" {{ 'selected' if usuario and usuario.estado == 0 else '' }}>Inactivo</option>
        </select>

        <div style="display:flex; gap:.5rem;">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{{ url_for('usuarios.listar_usuarios') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
