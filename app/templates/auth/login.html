{% extends "base.html" %}

{% block title %}Iniciar sesión — Hospital{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="col-12 col-md-6 col-lg-4">
        <div class="card">
            <div class="card-header">
                <h2>Iniciar sesión</h2>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <label for="usuario">Usuario</label>
                    <input class="form-control my-2" type="text" id="usuario" name="usuario" required autofocus>

                    <label for="password">Contraseña</label>
                    <input class="form-control my-2" type="password" id="password" name="password" required>

                    <button type="submit" class="btn btn-primary my-2">Entrar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
