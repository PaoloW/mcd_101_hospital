{% macro pagination_info(pagination, busqueda='') %}
<div class="d-flex justify-content-between align-items-center mt-3">
    <div class="text-muted">
        Mostrando {{ pagination.first }}–{{ pagination.last }} de {{ pagination.total }} registros
    </div>
    <div class="d-flex align-items-center gap-2">
        <label for="page-select" class="form-label mb-0">Página</label>
        <select id="page-select" class="form-select form-select-sm" style="width: auto;"
                onchange="location.href='?page=' + this.value + '{% if busqueda %}&busqueda={{ busqueda }}{% endif %}#table'">
            {% for page_num in range(1, pagination.pages + 1) %}
            <option value="{{ page_num }}" {% if page_num == pagination.page %}selected{% endif %}>
                {{ page_num }}
            </option>
            {% endfor %}
        </select>
        <span class="text-muted">de {{ pagination.pages }}</span>
    </div>
</div>
{% endmacro %}
