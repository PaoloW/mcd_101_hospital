{% extends "base.html" %}

{% block title %}{{ 'Editar' if procedimiento else 'Nuevo' }} procedimiento — Hospital{% endblock %}

{% block content %}
<div class="d-flex justify-content-center">
    <div class="card col-12 col-md-9">
        <div class="card-header">
            <h2 class="mb-0">{{ 'Editar' if procedimiento else 'Nuevo' }} procedimiento</h2>
        </div>
        <div class="card-body">
            <form method="POST"
                action="{{ url_for('procedimientos.actualizar_procedimiento', procedimiento_id=procedimiento.id) if procedimiento else url_for('procedimientos.guardar_procedimiento') }}">
                <div class="row">
                    <div class="col-12 col-md-4 mb-3">
                        <label class="form-label" for="codigo_cpms">Código CPMS</label>
                        <input type="text" id="codigo_cpms" name="codigo_cpms" class="form-control"
                            value="{{ procedimiento.codigo_cpms if procedimiento else '' }}" maxlength="8" required>
                    </div>
                    <div class="col-12 col-md-8 mb-3">
                        <label class="form-label" for="seccion_procedimiento_id">Sección</label>
                        <select id="seccion_procedimiento_id" name="seccion_procedimiento_id" class="form-select" required>
                            <option value="">— Seleccionar —</option>
                            {% for seccion in secciones %}
                            <option value="{{ seccion.id }}"
                                {{ 'selected' if procedimiento and procedimiento.seccion_procedimiento_id == seccion.id else '' }}>
                                {{ seccion.codigo ~ ' — ' if seccion.codigo else '' }}{{ seccion.nombre }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-12 mb-3">
                        <label class="form-label" for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" class="form-control"
                            value="{{ procedimiento.nombre if procedimiento else '' }}" maxlength="512" required>
                    </div>
                    <div class="col-12 text-end">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                        <a href="{{ url_for('procedimientos.listar_procedimientos') }}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
